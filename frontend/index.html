<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a14" />
    <meta name="description" content="FaeNet - a rede social academica da ETESC." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>FaeNet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/experience.css" />
    <link rel="icon" type="image/svg+xml" href="/img/faenet-mark.svg" />
    <link rel="apple-touch-icon" href="/img/faenet-mark.svg" />
</head>
<body>
    <!-- Loading inicial -->
    <div id="app-loading" class="app-loading">
        <img class="app-loading__logo" src="/img/faenet-mark.svg" alt="FaeNet" />
        <div class="app-loading__title">FaeNet</div>
        <div class="app-loading__spinner"></div>
    </div>

    <!-- Conteudo principal (SPA) -->
    <div id="app" class="app" hidden></div>

    <!-- Toast container -->
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

    <!-- Modal root -->
    <div id="modal-root" class="modal-root" hidden></div>

    <!-- Templates HTML usados pelos modulos JS -->
    <template id="tpl-login">
        <div class="auth auth--login">
            <div class="auth__backdrop" aria-hidden="true"></div>
            <section class="auth__panel auth__panel--login">
                <div class="auth__login-content">
                    <div class="auth__brand">
                        <img class="auth__logo" src="/img/faenet-mark.svg" alt="" />
                        <div>
                            <div class="auth__logo--text">FaeNet</div>
                            <div class="auth__tagline">Rede acadêmica da ETESC</div>
                        </div>
                    </div>
                    <form class="auth__form auth__form--login" data-form="login">
                        <div class="auth__eyebrow">Portal do aluno</div>
                        <h1 class="auth__title">Bem-vindo de volta</h1>
                        <p class="auth__subtitle">Entre para continuar na comunidade FaeNet.</p>
                        <label class="field">
                            <span class="field__label">Usuário</span>
                            <span class="auth__input-wrap"><span class="auth__input-icon" aria-hidden="true">♙</span><input class="field__input" name="username" type="text" required autocomplete="username" placeholder="Seu usuário" /></span>
                        </label>
                        <label class="field">
                            <span class="field__label">Senha</span>
                            <span class="auth__password-wrap">
                                <span class="auth__input-icon" aria-hidden="true">◇</span>
                                <input class="field__input" name="password" type="password" required autocomplete="current-password" placeholder="Sua senha" />
                                <button class="auth__password-toggle" type="button" data-action="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
                                    <span aria-hidden="true">◉</span>
                                </button>
                            </span>
                        </label>
                        <div class="auth__options">
                            <label class="auth__remember"><input type="checkbox" name="remember" checked /><span>Lembrar de mim</span></label>
                            <button type="button" class="auth__forgot" data-action="forgot-password">Esqueci minha senha</button>
                        </div>
                        <button class="btn btn--primary btn--block auth__submit" type="submit">Entrar</button>
                        <div class="auth__divider"><span>Ainda não faz parte?</span></div>
                        <a class="btn btn--ghost btn--block auth__create" href="/register" data-link>Criar conta</a>
                        <details class="auth__demo">
                            <summary>⚗ Acessar conta de demonstração</summary>
                            <button type="button" class="auth__demo-account" data-demo-user="pablo">pablo <span>demo1234</span></button>
                            <button type="button" class="auth__demo-account" data-demo-user="marlon">marlon <span>demo1234</span></button>
                            <button type="button" class="auth__demo-account" data-demo-user="aline">aline <span>demo1234</span></button>
                        </details>
                    </form>
                </div>
            </section>
            <section class="auth__story" aria-label="Sobre a comunidade FaeNet">
                <div class="auth__story-copy">
                    <h2>Ideias encontram<br />pessoas.<br /><strong>Projetos ganham vida.</strong></h2>
                    <p>CONECTE &nbsp;·&nbsp; COLABORE &nbsp;·&nbsp; CONSTRUA</p>
                </div>
                <div class="auth__story-chip auth__story-chip--ideas"><span class="auth__story-chip-icon">♚</span><span><b>Encontre sua equipe</b><small>Pessoas certas para grandes ideias.</small></span></div>
                <div class="auth__story-chip auth__story-chip--community"><span class="auth__story-chip-icon">✦</span><span><b>Crie algo incrível</b><small>Da ideia ao projeto, juntos na FaeNet.</small></span></div>
            </section>
        </div>
    </template>

    <template id="tpl-register">
        <div class="auth auth--register">
            <div class="auth__panel">
                <div class="auth__brand">
                    <div class="auth__logo">FaeNet</div>
                    <div class="auth__tagline">Crie sua conta e faca parte.</div>
                </div>
                <form class="auth__form" data-form="register">
                    <h2 class="auth__title">Criar conta</h2>
                    <label class="field">
                        <span class="field__label">Nome de usuario</span>
                        <input class="field__input" name="username" type="text" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.]{3,30}" placeholder="ex: maria.silva" />
                    </label>
                    <label class="field">
                        <span class="field__label">Nome completo</span>
                        <input class="field__input" name="name" type="text" required maxlength="120" placeholder="Seu nome completo" />
                    </label>
                    <div class="field-row">
                        <label class="field">
                            <span class="field__label">Curso</span>
                            <input class="field__input" name="curso" type="text" maxlength="80" placeholder="Informatica" />
                        </label>
                        <label class="field">
                            <span class="field__label">Turma</span>
                            <input class="field__input" name="turma" type="text" maxlength="100" placeholder="3 Ano - Informatica" />
                        </label>
                    </div>
                    <label class="field">
                        <span class="field__label">Senha</span>
                        <input class="field__input" name="password" type="password" required minlength="6" maxlength="128" autocomplete="new-password" placeholder="minimo 6 caracteres" />
                    </label>
                    <button class="btn btn--primary btn--block" type="submit">Cadastrar</button>
                    <p class="auth__hint">Ja tem conta? <a href="/login" data-link>Entrar</a></p>
                </form>
            </div>
            <div class="auth__art" aria-hidden="true">
                <div class="auth__art-grid"></div>
                <div class="auth__art-glow"></div>
            </div>
        </div>
    </template>

    <!-- App shell (carregado apos login) -->
    <template id="tpl-app">
        <div class="shell">
            <aside class="sidebar" aria-label="Menu principal">
                <div class="sidebar__brand">
                    <img class="sidebar__logo" src="/img/faenet-mark.svg" alt="FaeNet" />
                    <div class="sidebar__logo-text">FaeNet</div>
                </div>
                <nav class="sidebar__nav">
                    <a class="sidebar__link" data-route="feed" href="/feed" data-tip="Início"><span class="sidebar__icon">⌂</span><span>Início</span></a>
                    <a class="sidebar__link" data-route="explore" href="/explore" data-tip="Explorar"><span class="sidebar__icon">⌕</span><span>Explorar</span></a>
                    <a class="sidebar__link" data-route="faematch" href="/faematch" data-tip="FaeMatch"><span class="sidebar__icon">♧</span><span>FaeMatch</span></a>
                    <a class="sidebar__link" data-route="faemap" href="/faemap" data-tip="FaeMap"><span class="sidebar__icon">⌖</span><span>FaeMap</span></a>
                    <a class="sidebar__link" data-route="hub" href="/hub" data-tip="FaeHub+"><span class="sidebar__icon">◇</span><span>FaeHub+</span></a>
                    <a class="sidebar__link" data-route="messages" href="/messages" data-tip="Mensagens"><span class="sidebar__icon">□</span><span>Mensagens</span><span class="badge" data-badge="messages" hidden>0</span></a>
                    <a class="sidebar__link" data-route="notifications" href="/notifications" data-tip="Notificações"><span class="sidebar__icon">♢</span><span>Notificações</span><span class="badge" data-badge="notifications" hidden>0</span></a>
                    <a class="sidebar__link" data-route="profile" href="/profile" data-tip="Perfil"><span class="sidebar__icon">♙</span><span>Perfil</span></a>
                    <a class="sidebar__link" data-route="settings" href="/settings" data-tip="Configurações"><span class="sidebar__icon">⚙</span><span>Configurações</span></a>
                </nav>
                <button class="btn btn--primary btn--block sidebar__compose" data-action="compose">
                    <span>+ Criar publicacao</span>
                </button>
                <div class="sidebar__user" data-action="me-menu">
                    <div class="avatar avatar--sm" data-avatar="me">FN</div>
                    <div class="sidebar__user-info">
                        <div class="sidebar__user-name" data-text="me-name">Carregando...</div>
                        <div class="sidebar__user-username" data-text="me-username">@...</div>
                    </div>
                </div>
                <button class="sidebar__logout" data-action="logout">Sair</button>
            </aside>

            <main class="main" data-view="main"></main>

            <aside class="rightbar" aria-label="Sugestoes e atalhos">
                <div class="rightbar__top"><button class="rightbar__top-action" aria-label="Pesquisar">⌕</button><button class="rightbar__top-action" aria-label="Notificações">♢</button></div>
                <div class="rightbar__block rightbar__block--online">
                    <div class="rightbar__heading"><div class="rightbar__title">Agora na FaeNet</div><a href="/faemap" data-link><span class="presence-dot"></span> Ver mapa</a></div>
                    <div class="rightbar__list" data-list="online"></div>
                </div>
                <div class="rightbar__block rightbar__featured">
                    <div class="rightbar__heading"><div class="rightbar__title">Projetos em destaque</div><a href="/faematch" data-link>Ver todos</a></div>
                    <a href="/faematch" data-link class="featured-project"><span class="featured-project__icon">↗</span><span><b>StudyFlow</b><small>Organize seus estudos com IA</small></span><span>♥ 42</span></a>
                    <a href="/faematch" data-link class="featured-project"><span class="featured-project__icon featured-project__icon--green">⌁</span><span><b>EcoCampus</b><small>Sustentabilidade no campus</small></span><span>♥ 28</span></a>
                </div>
                <div class="rightbar__block rightbar__shortcut">
                    <div class="rightbar__hub-icon">◇</div><div class="rightbar__title">FaeHub+</div>
                    <p class="muted">Seu portal acadêmico para notas, frequência, horários e muito mais.</p>
                    <a class="btn btn--primary btn--block" href="/hub" data-link>Abrir FaeHub+ ↗</a>
                </div>
                <div class="rightbar__list is-hidden-data" data-list="suggestions" hidden></div>
            </aside>

            <nav class="bottombar" aria-label="Navegacao inferior">
                <a class="bottombar__link" data-route="feed" href="/feed"><span>🏠</span><span>Inicio</span></a>
                <a class="bottombar__link" data-route="explore" href="/explore"><span>🔍</span><span>Explorar</span></a>
                <a class="bottombar__link" data-route="faematch" href="/faematch"><span>👥</span><span>Match</span></a>
                <button class="bottombar__compose" data-action="compose">＋</button>
                <a class="bottombar__link" data-route="faemap" href="/faemap"><span>⌖</span><span>Mapa</span></a>
                <a class="bottombar__link" data-route="messages" href="/messages"><span>✉️</span><span>Chat</span><span class="badge" data-badge="messages" hidden>0</span></a>
                <a class="bottombar__link" data-route="notifications" href="/notifications"><span>🔔</span><span>Notif.</span><span class="badge" data-badge="notifications" hidden>0</span></a>
            </nav>
        </div>
    </template>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/feed.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/messages.js"></script>
    <script src="/js/faematch.js"></script>
    <script src="/js/faemap.js"></script>
    <script src="/js/hub.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/explore.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
