  <linearGradient id="skinSide"><stop stop-color="color-mix(in srgb,var(--skin) 72%,#39262a)"/><stop offset=".48" stop-color="var(--skin)"/><stop offset="1" stop-color="color-mix(in srgb,var(--skin) 82%,white)"/></linearGradient>
  <linearGradient id="cloth" x2="1" y2="1"><stop stop-color="color-mix(in srgb,var(--shirt) 55%,#071827)"/><stop offset=".48" stop-color="var(--shirt)"/><stop offset=".76" stop-color="color-mix(in srgb,var(--shirt) 78%,white)"/><stop offset="1" stop-color="color-mix(in srgb,var(--shirt) 57%,#0b1424)"/></linearGradient>
  <linearGradient id="bottom"><stop stop-color="color-mix(in srgb,var(--bottom) 64%,#071827)"/><stop offset=".5" stop-color="var(--bottom)"/><stop offset="1" stop-color="color-mix(in srgb,var(--bottom) 68%,white)"/></linearGradient>
  <linearGradient id="shoe" y2="1"><stop stop-color="color-mix(in srgb,var(--shoes) 78%,white)"/><stop offset=".7" stop-color="var(--shoes)"/><stop offset="1" stop-color="color-mix(in srgb,var(--shoes) 60%,#304257)"/></linearGradient>
</defs>
