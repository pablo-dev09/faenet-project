<!-- Adaptado do rig avatar_model.html do FaeHub+: https://github.com/ThiagoZotti/faehub-plus -->
<svg class="faehub-avatar" width="300" height="440" viewBox="0 0 300 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Avatar FaeHub+" data-appearance="masculine" data-hairstyle="short" data-outfit="hoodie" data-bottom="trousers" data-shoes="sneakers">
<style>
  .optional{display:none}.faehub-avatar[data-appearance="masculine"] .masculine,.faehub-avatar[data-appearance="feminine"] .feminine{display:block}
  .faehub-avatar[data-hairstyle="short"] .hair-short,.faehub-avatar[data-hairstyle="fade"] .hair-fade,.faehub-avatar[data-hairstyle="long"] .hair-long,.faehub-avatar[data-hairstyle="waves"] .hair-waves,.faehub-avatar[data-hairstyle="curls"] .hair-curls,.faehub-avatar[data-hairstyle="bun"] .hair-bun,.faehub-avatar[data-hairstyle="afro"] .hair-afro{display:block}
  .faehub-avatar[data-outfit="hoodie"] .hoodie,.faehub-avatar[data-outfit="tee"] .tee,.faehub-avatar[data-outfit="tank"] .tank{display:block}
  .faehub-avatar[data-bottom="trousers"] .trousers,.faehub-avatar[data-bottom="shorts"] .shorts{display:block}
  .faehub-avatar[data-shoes="sneakers"] .sneakers,.faehub-avatar[data-shoes="flipflops"] .flipflops{display:block}
  .faehub-avatar.has-glasses .glasses,.faehub-avatar.has-headphones .headphones,.faehub-avatar.has-earrings .earrings,.faehub-avatar.has-backpack .backpack,.faehub-avatar.has-watch .watch{display:block}
</style>
<defs>
